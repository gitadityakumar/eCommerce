<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f5f0" />
      <stop offset="100%" stop-color="#ede8df" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b24d4f" />
      <stop offset="100%" stop-color="#8f6b55" />
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg)" />
  <g transform="translate(200, 230) scale(1.1)" text-anchor="middle">
    <!-- Stylized Atelier Hair Bow Icon -->
    <path d="M-6 -8 C-25 -45 -70 -50 -75 -15 C-80 15 -35 25 -5 6 Z" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M6 -8 C25 -45 70 -50 75 -15 C80 15 35 25 5 6 Z" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center knot -->
    <ellipse cx="0" cy="-1" rx="8" ry="11" fill="none" stroke="url(#gold)" stroke-width="2.5" />
    <!-- Ribbon tails -->
    <path d="M-4 9 C-15 35 -35 60 -50 80 C-45 80 -30 65 -15 50 C-10 65 -8 75 -5 85" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M4 9 C15 35 35 60 50 80 C45 80 30 65 15 50 C10 65 8 75 5 85" fill="none" stroke="url(#gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Atelier caption -->
    <text y="125" font-family="'Playfair Display', serif" font-size="14" font-weight="400" letter-spacing="4" fill="#8f6b55" text-transform="uppercase">Preety Twist</text>
    <text y="145" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" letter-spacing="3" fill="#b0a89c" text-transform="uppercase">Atelier Piece</text>
  </g>
</svg>
